	[doors.general]
		#Master switch for Tutta's Doors. Disabling it removes the module's content and creative tab
		#and leaves vanilla and other mods' doors unchanged.
		moduleEnabled = true

	[doors.content]
		#Enables the consistent door set for every available wood family.
		consistentEnabled = true
		#Enables the transit door set for every available wood family.
		transitEnabled = true
		#Enables the pet door set for every available wood family.
		petEnabled = true
		#Enables the lateral door set for every available wood family.
		lateralEnabled = true
		#Enables the secret door set for every available wood family.
		secretEnabled = true

	[beds.general]
		#Master switch for the whole beds module. Disabling registers none of its content
		#and leaves vanilla and other mods' bed behavior unchanged.
		moduleEnabled = true

		[beds.content.mattresses]
			#Disabling also disables every straw-mattress bed variant.
			strawMattressEnabled = true
			#Disabling also disables every soft-mattress bed variant.
			softMattressEnabled = true

		[beds.content.basicCovers]
			#Disabling also disables every Tier LOW wheat-covered variant.
			wheatCoverEnabled = true
			#Disabling also disables every Tier LOW raw-leather-covered variant.
			leatherCoverEnabled = true

		[beds.content.blankets]
			#Disabling also disables every Tier NORMAL wool-blanket bed and, since it's
			#the only blanket with a Tier DELUXE upgrade path, every Tier DELUXE bed too.
			woolBlanketEnabled = true
			#Disabling also disables every Tier NORMAL leather-blanket bed.
			leatherBlanketEnabled = true
			#Master switch for Tier DELUXE specifically, independent of woolBlanketEnabled.
			deluxeTierEnabled = true
			#Registers standalone wool, leather and deluxe wool blanket items.
			#They are used as fallbacks when a blanket has no enabled data-driven item assignment.
			#They can apply blankets or be combined with a bare bed, but have no recipe of their own.
			#The items are registered only when their corresponding bed variants exist.
			blanketItemsEnabled = false

		[beds.gameplay.villagers]
			#Allows villagers to claim and sleep in Tutta's Beds, loose mattresses and bed frames.
			canUseTuttaBeds = true

		[beds.compatibility.farmersDelight]
			#Disabling also disables every canvas-mattress bed variant.
			canvasMattressEnabled = true
			#Disabling also disables every Farmer's Delight straw-mattress bed variant
			#(independent of content.mattresses.strawMattressEnabled, which is this module's own wheat mattress).
			strawMattressEnabled = true
			#Disabling also disables every Tier LOW canvas-covered variant, for every material.
			canvasCoverEnabled = true

	[delights.general]
		#Master switch for Tutta's Delights.
		#The module only loads when Farmer's Delight is installed.
		moduleEnabled = true

	[delights.content]
		#Enables the suckling pig content group.
		sucklingPigEnabled = true
		#Enables the ancient content group.
		ancientEnabled = true
		#Enables the potato content group.
		potatoEnabled = true
		#Enables the creeper content group.
		creeperEnabled = true
		#Enables the slime content group.
		slimeEnabled = true
		#Enables the frozen treats content group.
		frozenTreatsEnabled = true
		#Enables the frog content group.
		frogEnabled = true
		#Enables the extra meals content group.
		extraMealsEnabled = true
		#Enables the breaded content group.
		breadedEnabled = true
		#Enables the sandwich portions content group.
		sandwichPortionsEnabled = true
		#Enables the undead content group.
		undeadEnabled = true
